version: "3.9"

services:
  backend:
    build:
      context: .
    container_name: hc-uti-backend-homolog
    env_file: .env
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: always

  nginx:
    image: docker.io/library/nginx:alpine
    container_name: hc-uti-nginx-homolog
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: always
